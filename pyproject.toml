[project]
name = "generate-meeting-notes"
version = "0.1.0"
description = "自動化會議記錄產生 skill：音訊拆分 → NotebookLM → Google Doc"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.192.0",
    "google-auth>=2.49.0",
    "google-auth-oauthlib>=1.3.0",
    "notebooklm-py[browser]>=0.3.3",
    "slack-sdk>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
